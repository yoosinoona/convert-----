name: Convert 2xParagonSR_Nano_gan to NCNN (Build PNNX from Source)

on:
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download ONNX from Phhofm Release
        run: |
          echo "⬇️ Đang tải file ONNX..."
          wget -O 2xParagonSR_Nano_gan.onnx https://github.com/Phhofm/models/releases/download/2xParagonSR_Nano_gan/2xParagonSR_Nano_gan_op18_fp16.onnx
          echo "✅ Tải ONNX thành công!"

      - name: Install Dependencies for PNNX Build
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git cmake wget unzip python3-pip
          pip3 install onnx onnxsim

      - name: Clone PNNX Repository
        run: |
          echo "📥 Đang clone repo PNNX từ GitHub..."
          git clone --recursive https://github.com/nihui/pnnx.git
          cd pnnx
          # Clone PyTorch (LibTorch) - PNNX cần thư viện này để build
          echo " Đang tải LibTorch (CPU, ~500MB)..."
          # Dùng link LibTorch CPU bản stable mới nhất (không cần CUDA)
          wget -q https://download.pytorch.org/libtorch/cpu/libtorch-shared-with-deps-2.2.2%2Bcpu.zip -O libtorch.zip
          unzip -q libtorch.zip
          echo "✅ LibTorch sẵn sàng!"

      - name: Build PNNX
        run: |
          echo "🔨 Đang build PNNX từ source (mất khoảng 5-8 phút)..."
          cd pnnx/src
          # Set biến môi trường trỏ đến LibTorch vừa tải
          export Torch_DIR=$(pwd)/../libtorch/share/cmake/Torch
          
          mkdir build && cd build
          cmake ..
          make -j$(nproc)
          
          echo "✅ Build PNNX thành công!"
          ls -lh pnnx

      - name: Simplify ONNX
        run: |
          python3 -m onnxsim 2xParagonSR_Nano_gan.onnx 2xParagonSR_Nano_gan_sim.onnx || {
            cp 2xParagonSR_Nano_gan.onnx 2xParagonSR_Nano_gan_sim.onnx
          }

      - name: Convert ONNX to NCNN using PNNX
        run: |
          echo "🔹 Đang convert bằng PNNX..."
          ./pnnx/src/build/pnnx 2xParagonSR_Nano_gan_sim.onnx inputshape=[1,3,256,256]
          
          echo "✅ Convert thành công! File kết quả:"
          ls -lh *.ncnn.param *.ncnn.bin

      - name: Upload NCNN Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 2xParagonSR_Nano_gan_ncnn_pnnx
          path: |
            2xParagonSR_Nano_gan.ncnn.param
            2xParagonSR_Nano_gan.ncnn.bin
          retention-days: 90
