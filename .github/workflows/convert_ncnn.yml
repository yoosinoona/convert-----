name: Convert 2xParagonSR_Nano_gan to NCNN (via PNNX CLI)

on:
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download ONNX from Phhofm Release
        run: |
          echo "⬇️ Đang tải file ONNX..."
          wget -O 2xParagonSR_Nano_gan.onnx https://github.com/Phhofm/models/releases/download/2xParagonSR_Nano_gan/2xParagonSR_Nano_gan_op18_fp16.onnx
          echo "✅ Tải ONNX thành công!"

      - name: Setup Python & Install PNNX
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: |
          echo "📦 Đang cài đặt PNNX..."
          pip install pnnx onnxsim
          echo "✅ Cài đặt PNNX thành công!"

      - name: Convert ONNX to NCNN using PNNX CLI
        run: |
          echo "🔹 Đang convert bằng PNNX CLI..."
          
          # PNNX CLI nhận file ONNX trực tiếp
          pnnx 2xParagonSR_Nano_gan.onnx inputshape=[1,3,256,256]
          
          echo "✅ Convert thành công! File NCNN kết quả:"
          ls -lh *.ncnn.param *.ncnn.bin

      - name: Upload NCNN Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 2xParagonSR_Nano_gan_ncnn_pnnx
          path: |
            *.ncnn.param
            *.ncnn.bin
          retention-days: 90
