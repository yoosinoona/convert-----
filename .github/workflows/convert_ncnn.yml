name: Convert 2xParagonSR_Nano_gan to NCNN

on:
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download ONNX from Phhofm Release
        run: |
          echo "⬇️ Đang tải file ONNX từ GitHub Release của tác giả..."
          # File được tác giả khuyến nghị (FP16 sẵn, opset 18)
          wget -O model.onnx https://github.com/Phhofm/models/releases/download/2xParagonSR_Nano_gan/2xParagonSR_Nano_gan_op18_fp16.onnx
          
          echo "✅ Tải thành công!"
          ls -lh model.onnx

      - name: Setup Python & Install onnxsim
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install onnx onnxsim

      - name: Download Pre-built NCNN Tools
        run: |
          echo "⬇️ Đang tải bộ công cụ NCNN build sẵn..."
          wget -q https://github.com/Tencent/ncnn/releases/download/20240410/ncnn-20240410-ubuntu-2004.zip
          unzip -q ncnn-20240410-ubuntu-2004.zip
          chmod +x ncnn-20240410-ubuntu-2004/bin/onnx2ncnn
          chmod +x ncnn-20240410-ubuntu-2004/bin/ncnnoptimize

      - name: Simplify ONNX
        run: |
          echo "🔹 Bước 1: Simplify ONNX với onnxsim..."
          python -m onnxsim model.onnx model_sim.onnx || {
            echo "⚠️ onnxsim thất bại, dùng file gốc."
            cp model.onnx model_sim.onnx
          }

      - name: Convert to NCNN
        run: |
          echo "🔹 Bước 2: Convert sang NCNN (.param và .bin)..."
          ./ncnn-20240410-ubuntu-2004/bin/onnx2ncnn model_sim.onnx model.param model.bin
          
          # Fix lỗi DepthToSpace -> PixelShuffle (thường gặp ở model SR)
          sed -i 's/DepthToSpace/PixelShuffle/g' model.param
          
          echo "📊 Kích thước file sau khi convert:"
          ls -lh model.param model.bin

      - name: Optimize NCNN Model
        run: |
          echo "🔹 Bước 3: Optimize cấu trúc NCNN..."
          # File đã FP16 sẵn từ tác giả, chỉ cần optimize cấu trúc (flag 0 = giữ nguyên precision)
          ./ncnn-20240410-ubuntu-2004/bin/ncnnoptimize model.param model.bin model_opt.param model_opt.bin 0
          
          echo "✅ Hoàn tất! File kết quả:"
          ls -lh model_opt.param model_opt.bin

      - name: Upload NCNN Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 2xParagonSR_Nano_gan_ncnn
          path: |
            model_opt.param
            model_opt.bin
          retention-days: 90
