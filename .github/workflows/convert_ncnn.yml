name: Convert 2xParagonSR_Nano_gan to NCNN (Pre-built OS-matched)

on:
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download ONNX from Phhofm Release
        run: |
          echo "⬇️ Đang tải file ONNX..."
          wget -O 2xParagonSR_Nano_gan.onnx https://github.com/Phhofm/models/releases/download/2xParagonSR_Nano_gan/2xParagonSR_Nano_gan_op18_fp16.onnx
          echo "✅ Tải ONNX thành công!"

      - name: Setup Python & Install onnxsim
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: |
          echo "📦 Đang cài đặt onnxsim..."
          pip install onnxsim
          echo "✅ Simplify ONNX..."
          python3 -m onnxsim 2xParagonSR_Nano_gan.onnx 2xParagonSR_Nano_gan_sim.onnx || {
            echo "⚠️ onnxsim thất bại, dùng file gốc."
            cp 2xParagonSR_Nano_gan.onnx 2xParagonSR_Nano_gan_sim.onnx
          }

      - name: Download NCNN Tools (Matching OS Version)
        run: |
          echo "🔍 Đang xác định phiên bản Ubuntu của Runner..."
          # Tự động lấy version OS (ví dụ: 2204, 2404)
          OS_VER=$(lsb_release -rs | tr -d '.')
          echo "✅ Phiên bản Ubuntu: $OS_VER"
          
          # Tải bản pre-built khớp chính xác với OS để tránh lỗi libprotobuf
          URL="https://github.com/Tencent/ncnn/releases/download/20240410/ncnn-20240410-ubuntu-${OS_VER}.zip"
          echo "⬇️ Đang tải từ: $URL"
          
          wget -q "$URL" -O ncnn-tools.zip || {
              echo "⚠️ Không tìm thấy bản cho $OS_VER, chuyển sang fallback Ubuntu 2204..."
              wget -q "https://github.com/Tencent/ncnn/releases/download/20240410/ncnn-20240410-ubuntu-2204.zip" -O ncnn-tools.zip
          }
          
          unzip -q ncnn-tools.zip
          chmod +x ncnn-20240410-ubuntu-*/bin/onnx2ncnn
          chmod +x ncnn-20240410-ubuntu-*/bin/ncnnoptimize
          echo "✅ Tải và giải nén NCNN tools thành công!"

      - name: Convert ONNX to NCNN
        run: |
          echo "🔹 Bước 1: Convert sang NCNN..."
          
          # Tự động tìm thư mục bin chứa tools
          BIN_DIR=$(find . -maxdepth 2 -type d -name "bin" | grep ncnn | head -1)
          echo "📂 Sử dụng thư mục tools: $BIN_DIR"
          
          $BIN_DIR/onnx2ncnn 2xParagonSR_Nano_gan_sim.onnx model.param model.bin
          
          # Fix lỗi DepthToSpace -> PixelShuffle (thường gặp ở model SR)
          sed -i 's/DepthToSpace/PixelShuffle/g' model.param
          
          echo " Kích thước file sau khi convert:"
          ls -lh model.param model.bin

      - name: Optimize NCNN Model (FP16)
        run: |
          echo "🔹 Bước 2: Optimize sang FP16 (Giảm dung lượng, tăng tốc GPU mobile)..."
          
          BIN_DIR=$(find . -maxdepth 2 -type d -name "bin" | grep ncnn | head -1)
          
          # Flag 1: Ép weights sang FP16 packed
          $BIN_DIR/ncnnoptimize model.param model.bin model_opt.param model_opt.bin 1
          
          echo "✅ Hoàn tất! File kết quả cuối cùng:"
          ls -lh model_opt.param model_opt.bin

      - name: Upload NCNN Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 2xParagonSR_Nano_gan_ncnn_final
          path: |
            model_opt.param
            model_opt.bin
          retention-days: 90
