name: Convert 2xParagonSR_Nano_gan to NCNN (via PNNX)

on:
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download ONNX from Phhofm Release
        run: |
          echo "⬇️ Đang tải file ONNX từ GitHub Release..."
          wget -O 2xParagonSR_Nano_gan.onnx https://github.com/Phhofm/models/releases/download/2xParagonSR_Nano_gan/2xParagonSR_Nano_gan_op18_fp16.onnx
          echo "✅ Tải thành công!"
          ls -lh 2xParagonSR_Nano_gan.onnx

      - name: Download PNNX Tool
        run: |
          echo "️ Đang tải PNNX (công cụ convert chính chủ của NCNN)..."
          wget -q https://github.com/nihui/pnnx/releases/download/20240226/pnnx-20240226-linux.zip
          unzip -q pnnx-20240226-linux.zip
          chmod +x pnnx
          echo "✅ Tải PNNX thành công!"

      - name: Convert ONNX to NCNN using PNNX
        run: |
          echo "🔹 Đang convert bằng PNNX..."
          # PNNX cần dummy input shape cho model SR. 1,3,256,256 là chuẩn.
          ./pnnx 2xParagonSR_Nano_gan.onnx inputshape=[1,3,256,256]
          
          echo "✅ Convert thành công! File kết quả:"
          ls -lh *.ncnn.param *.ncnn.bin

      - name: Upload NCNN Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 2xParagonSR_Nano_gan_ncnn_pnnx
          path: |
            2xParagonSR_Nano_gan.ncnn.param
            2xParagonSR_Nano_gan.ncnn.bin
          retention-days: 90
