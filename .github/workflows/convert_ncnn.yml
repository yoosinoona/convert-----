name: Convert 2xParagonSR_Nano_gan to NCNN (Clean)

on:
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python & Simplify ONNX
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
        run: |
          pip install onnx onnxsim
          wget -O 2xParagonSR_Nano_gan.onnx https://github.com/Phhofm/models/releases/download/2xParagonSR_Nano_gan/2xParagonSR_Nano_gan_op18_fp16.onnx
          python -m onnxsim 2xParagonSR_Nano_gan.onnx 2xParagonSR_Nano_gan_sim.onnx || cp 2xParagonSR_Nano_gan.onnx 2xParagonSR_Nano_gan_sim.onnx

      - name: Download NCNN Tools (20240820)
        run: |
          wget -q https://github.com/Tencent/ncnn/releases/download/20240820/ncnn-20240820-ubuntu-2204.zip
          unzip -q ncnn-20240820-ubuntu-2204.zip
          chmod +x ncnn-20240820-ubuntu-2204/bin/onnx2ncnn

      - name: Convert ONNX to NCNN
        run: |
          echo "🔹 Đang convert trực tiếp từ ONNX FP16 sang NCNN..."
          ./ncnn-20240820-ubuntu-2204/bin/onnx2ncnn 2xParagonSR_Nano_gan_sim.onnx 2xParagonSR_Nano_gan.param 2xParagonSR_Nano_gan.bin
          
          # Fix duy nhất cần thiết: ONNX opset 18 dùng DepthToSpace, NCNN cần PixelShuffle
          sed -i 's/DepthToSpace/PixelShuffle/g' 2xParagonSR_Nano_gan.param
          
          echo "✅ Hoàn tất! Kết quả:"
          ls -lh 2xParagonSR_Nano_gan.param 2xParagonSR_Nano_gan.bin

      - name: Upload NCNN Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 2xParagonSR_Nano_gan_ncnn_fp16
          path: |
            2xParagonSR_Nano_gan.param
            2xParagonSR_Nano_gan.bin
          retention-days: 90
