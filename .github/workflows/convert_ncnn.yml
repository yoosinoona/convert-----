name: Convert 2xParagonSR_Nano_gan to NCNN

on:
  # Chỉ cần bấm nút Run workflow thủ công, không cần push file nữa
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download ONNX from Phhofm Release
        run: |
          echo "️ Đang tải file ONNX trực tiếp từ GitHub Release của tác giả..."
          wget https://github.com/Phhofm/models/releases/download/2xParagonSR_Nano_gan/2xParagonSR_Nano_gan.onnx

      - name: Setup Python & Install onnxsim
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install onnx onnxsim

      - name: Download Pre-built NCNN Tools
        run: |
          echo "⬇️ Đang tải bộ công cụ NCNN build sẵn (tiết kiệm thời gian)..."
          wget https://github.com/Tencent/ncnn/releases/download/20240410/ncnn-20240410-ubuntu-2004.zip
          unzip ncnn-20240410-ubuntu-2004.zip
          chmod +x ncnn-20240410-ubuntu-2004/bin/onnx2ncnn
          chmod +x ncnn-20240410-ubuntu-2004/bin/ncnnoptimize

      - name: Simplify ONNX
        run: |
          echo "🔹 Bước 1: Simplify ONNX..."
          python -m onnxsim 2xParagonSR_Nano_gan.onnx 2xParagonSR_Nano_gan_sim.onnx || {
            echo "⚠️ onnxsim thất bại, dùng file gốc."
            cp 2xParagonSR_Nano_gan.onnx 2xParagonSR_Nano_gan_sim.onnx
          }

      - name: Convert to NCNN
        run: |
          echo "🔹 Bước 2: Convert sang NCNN..."
          ./ncnn-20240410-ubuntu-2004/bin/onnx2ncnn 2xParagonSR_Nano_gan_sim.onnx model.param model.bin
          
          # Tự động fix lỗi DepthToSpace -> PixelShuffle (thường gặp ở model SR)
          sed -i 's/DepthToSpace/PixelShuffle/g' model.param

      - name: Optimize to FP16
        run: |
          echo "🔹 Bước 3: Optimize sang FP16 (Giảm dung lượng, tăng tốc)..."
          ./ncnn-20240410-ubuntu-2004/bin/ncnnoptimize model.param model.bin model_opt.param model_opt.bin 1
          
          echo "✅ Hoàn tất! File kết quả:"
          ls -lh model_opt.param model_opt.bin

      - name: Upload NCNN Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 2xParagonSR_Nano_gan_ncnn_fp16
          path: |
            model_opt.param
            model_opt.bin
          retention-days: 90
