name: Convert 2xParagonSR_Nano_gan (Build Latest NCNN)

on:
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install deps
        run: |
          pip install onnx onnxsim
          sudo apt-get update
          sudo apt-get install -y cmake g++ libprotobuf-dev protobuf-compiler

      - name: Build latest onnx2ncnn from source
        run: |
          git clone https://github.com/Tencent/ncnn.git
          cd ncnn
          mkdir build && cd build
          cmake .. -DNCNN_BUILD_TOOLS=ON
          make -j$(nproc) onnx2ncnn ncnnoptimize
          cp onnx2ncnn /usr/local/bin/
          cp ncnnoptimize /usr/local/bin/
          cd ../..
          rm -rf ncnn

      - name: Download and Preprocess ONNX
        run: |
          wget -O model.onnx https://github.com/Phhofm/models/releases/download/2xParagonSR_Nano_gan/2xParagonSR_Nano_gan_op18_fp32.onnx
          
          # Dùng Python để thay thế Mish bằng Softplus+Tanh+Mul trước khi convert
          python -c "
          import onnx
          from onnx import helper
          
          model = onnx.load('model.onnx')
          input_name = model.graph.input[0].name
          print(f'Found input name: {input_name}')
          
          # Replace Mish nodes
          new_nodes = []
          mish_cnt = 0
          for node in model.graph.node:
              if node.op_type == 'Mish':
                  mish_cnt += 1
                  inp = node.input[0]
                  out = node.output[0]
                  sp_out = out + '_sp'
                  th_out = out + '_th'
                  new_nodes.append(helper.make_node('Softplus', [inp], [sp_out]))
                  new_nodes.append(helper.make_node('Tanh', [sp_out], [th_out]))
                  new_nodes.append(helper.make_node('Mul', [inp, th_out], [out]))
              else:
                  new_nodes.append(node)
          del model.graph.node[:]
          model.graph.node.extend(new_nodes)
          print(f'Replaced {mish_cnt} Mish nodes.')
          onnx.save(model, 'temp.onnx')
          
          # Simplify with forced input shape to fold Shape nodes
          import subprocess
          cmd = f'python -m onnxsim temp.onnx model_sim.onnx --input-shape {input_name}:1,3,256,256'
          print(f'Running: {cmd}')
          subprocess.run(cmd, shell=True, check=False)
          "
          
          # Fallback if onnxsim fails
          if [ ! -f "model_sim.onnx" ]; then
            echo "onnxsim failed, using non-simplified model"
            cp temp.onnx model_sim.onnx
          fi
          ls -lh model_sim.onnx

      - name: Convert ONNX to NCNN
        run: |
          onnx2ncnn model_sim.onnx 2xParagonSR_Nano_gan.param 2xParagonSR_Nano_gan.bin
          
          # Check if bin file is valid (> 50KB)
          BIN_SIZE=$(stat -c%s "2xParagonSR_Nano_gan.bin")
          if [ "$BIN_SIZE" -lt 50000 ]; then
            echo "ERROR: NCNN .bin file is too small ($BIN_SIZE bytes), conversion failed!"
            exit 1
          fi

          ncnnoptimize 2xParagonSR_Nano_gan.param 2xParagonSR_Nano_gan.bin 2xParagonSR_Nano_gan_opt.param 2xParagonSR_Nano_gan_opt.bin 65536
          
          mv 2xParagonSR_Nano_gan_opt.param 2xParagonSR_Nano_gan.param
          mv 2xParagonSR_Nano_gan_opt.bin 2xParagonSR_Nano_gan.bin
          
          sed -i 's/DepthToSpace/PixelShuffle/g' 2xParagonSR_Nano_gan.param
          
          ls -lh 2xParagonSR_Nano_gan.param 2xParagonSR_Nano_gan.bin

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 2xParagonSR_Nano_gan_ncnn_fixed
          path: |
            2xParagonSR_Nano_gan.param
            2xParagonSR_Nano_gan.bin
          retention-days: 90
