name: Convert 2xParagonSR_Nano_gan to NCNN (via PNNX Python)

on:
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download ONNX from Phhofm Release
        run: |
          echo "⬇️ Đang tải file ONNX..."
          wget -O 2xParagonSR_Nano_gan.onnx https://github.com/Phhofm/models/releases/download/2xParagonSR_Nano_gan/2xParagonSR_Nano_gan_op18_fp16.onnx
          echo "✅ Tải ONNX thành công!"

      - name: Setup Python & Install PNNX
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: |
          echo "📦 Đang cài đặt PNNX Python package..."
          pip install pnnx onnx onnxsim
          echo "✅ Cài đặt PNNX thành công!"
          pnnx --version || echo "PNNX đã sẵn sàng"

      - name: Convert ONNX to NCNN using PNNX Python API
        run: |
          echo "🔹 Đang convert bằng PNNX Python API..."
          
          # Tạo Python script để convert
          cat > convert.py << 'EOF'
          import pnnx
          import torch
          
          print("Đang convert model...")
          # PNNX sẽ tự động tạo file .ncnn.param và .ncnn.bin
          pnnx.export(
              "2xParagonSR_Nano_gan.onnx",
              inputs=torch.randn(1, 3, 256, 256),
              customop=""
          )
          print("✅ Convert thành công!")
          EOF
          
          python convert.py
          
          echo "📊 File NCNN kết quả:"
          ls -lh *.ncnn.param *.ncnn.bin

      - name: Upload NCNN Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 2xParagonSR_Nano_gan_ncnn_pnnx
          path: |
            *.ncnn.param
            *.ncnn.bin
          retention-days: 90
