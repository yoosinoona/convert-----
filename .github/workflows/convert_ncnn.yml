name: Convert ONNX to NCNN

on:
  # Cho phép chạy thủ công từ tab Actions
  workflow_dispatch:
  # Tự động chạy khi có file .onnx được push lên repo
  push:
    paths:
      - '*.onnx'

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies (onnxsim)
        run: |
          pip install onnx onnxsim

      - name: Build NCNN tools from source
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git cmake libprotobuf-dev protobuf-compiler
          git clone --recursive https://github.com/Tencent/ncnn.git
          cd ncnn
          mkdir build && cd build
          # Bật build tools, tắt examples và benchmark để build nhanh hơn
          cmake -DNCNN_BUILD_TOOLS=ON -DNCNN_BUILD_EXAMPLES=OFF -DNCNN_BUILD_BENCHMARK=OFF ..
          # SỬA LỖI: Build tất cả target thay vì gọi tên cụ thể
          make -j$(nproc) 

      - name: Convert ONNX to NCNN
        run: |
          ONNX_FILE="2xParagonSR_Nano_gan.onnx"
          
          if [ ! -f "$ONNX_FILE" ]; then
            echo "❌ Lỗi: Không tìm thấy file $ONNX_FILE."
            exit 1
          fi

          echo "🔹 Bước 1: Simplify ONNX..."
          python -m onnxsim "$ONNX_FILE" simplified.onnx || {
            echo "⚠️ onnxsim thất bại, dùng file gốc."
            cp "$ONNX_FILE" simplified.onnx
          }

          echo "🔹 Bước 2: Convert sang NCNN..."
          # Đường dẫn đến tools sau khi build toàn bộ
          ./ncnn/build/tools/onnx2ncnn simplified.onnx model.param model.bin

          # Fix lỗi DepthToSpace -> PixelShuffle
          sed -i 's/DepthToSpace/PixelShuffle/g' model.param

          echo "🔹 Bước 3: Optimize sang FP16..."
          ./ncnn/build/tools/ncnnoptimize model.param model.bin model_opt.param model_opt.bin 1
          
          echo "✅ Convert thành công!"

      - name: Upload NCNN Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 2xParagonSR_Nano_gan_ncnn_fp16
          path: |
            model_opt.param
            model_opt.bin
          retention-days: 7
