name: Convert 2xParagonSR_Nano_gan (Fix External Data & Mish) v2

on:
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install deps
        run: pip install onnx onnxsim

      - name: Download and Preprocess ONNX
        run: |
          # Tải cả 2 file cấu trúc và trọng số
          wget -O net_g_75000_fused_op18_fp32.onnx https://github.com/Phhofm/models/releases/download/2xParagonSR_Nano_gan/2xParagonSR_Nano_gan_op18_fp32.onnx
          wget -O net_g_75000_fused_op18_fp32.onnx.data https://github.com/Phhofm/models/releases/download/2xParagonSR_Nano_gan/2xParagonSR_Nano_gan_op18_fp32.onnx.data
          ls -lh net_g_75000_fused_op18_fp32.onnx net_g_75000_fused_op18_fp32.onnx.data
          
          # 1. Load model (lúc này Python sẽ đọc được trọng số từ file .data)
          # 2. Thay thế Mish bằng Softplus + Tanh + Mul
          # 3. Lưu thành 1 file duy nhất (temp.onnx), không còn phụ thuộc .data nữa
          python -c "
          import onnx
          from onnx import helper
          
          print('Loading ONNX with external data...')
          model = onnx.load('net_g_75000_fused_op18_fp32.onnx')
          input_name = model.graph.input[0].name
          print(f'Found input name: {input_name}')
          
          new_nodes = []
          mish_cnt = 0
          for node in model.graph.node:
              if node.op_type == 'Mish':
                  mish_cnt += 1
                  inp = node.input[0]
                  out = node.output[0]
                  sp_out = out + '_sp'
                  th_out = out + '_th'
                  new_nodes.append(helper.make_node('Softplus', [inp], [sp_out]))
                  new_nodes.append(helper.make_node('Tanh', [sp_out], [th_out]))
                  new_nodes.append(helper.make_node('Mul', [inp, th_out], [out]))
              else:
                  new_nodes.append(node)
          del model.graph.node[:]
          model.graph.node.extend(new_nodes)
          print(f'Replaced {mish_cnt} Mish nodes.')
          
          print('Saving combined ONNX (forcing single file)...')
          onnx.save(model, 'temp.onnx', save_as_external_data=False)
          print('Saved temp.onnx successfully.')
          "
          
          # Simplify và ép kích thước Input
          python -m onnxsim temp.onnx model_sim.onnx --input-shape "input:1,3,256,256" || cp temp.onnx model_sim.onnx
          ls -lh model_sim.onnx

      - name: Download NCNN tools
        run: |
          wget -q https://github.com/Tencent/ncnn/releases/download/20240820/ncnn-20240820-ubuntu-2204.zip
          unzip -q ncnn-20240820-ubuntu-2204.zip
          chmod +x ncnn-20240820-ubuntu-2204/bin/onnx2ncnn ncnn-20240820-ubuntu-2204/bin/ncnnoptimize
          
          # Install missing libprotobuf
          wget -q http://archive.ubuntu.com/ubuntu/pool/main/p/protobuf/libprotobuf23_3.12.4-1ubuntu7_amd64.deb
          sudo dpkg -i libprotobuf23_3.12.4-1ubuntu7_amd64.deb

      - name: Convert ONNX to NCNN
        run: |
          ./ncnn-20240820-ubuntu-2204/bin/onnx2ncnn model_sim.onnx 2xParagonSR_Nano_gan.param 2xParagonSR_Nano_gan.bin
          
          # Check if bin file is valid (> 50KB)
          BIN_SIZE=$(stat -c%s "2xParagonSR_Nano_gan.bin")
          if [ "$BIN_SIZE" -lt 50000 ]; then
            echo "ERROR: NCNN .bin file is too small ($BIN_SIZE bytes), conversion failed!"
            exit 1
          fi
          
          echo "Conversion successful! File sizes:"
          ls -lh 2xParagonSR_Nano_gan.param 2xParagonSR_Nano_gan.bin
          
          # Sửa DepthToSpace thành PixelShuffle
          sed -i 's/DepthToSpace/PixelShuffle/g' 2xParagonSR_Nano_gan.param

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 2xParagonSR_Nano_gan_ncnn_fixed
          path: |
            2xParagonSR_Nano_gan.param
            2xParagonSR_Nano_gan.bin
          retention-days: 90
