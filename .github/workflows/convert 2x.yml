      - name: Auto-Fix NCNN Param (The Ultimate Text Fix)
        run: |
          python3 << 'PYEOF'
          import re

          def ultimate_fix(input_file, output_file):
              with open(input_file, 'r') as f:
                  lines = f.readlines()
              
              new_lines = []
              added_slices = 0
              removed_dynamic = 0
              splits = [(0, 15), (15, 18), (18, 21), (21, 24)]
              
              for line in lines:
                  parts = line.strip().split()
                  
                  # 1. Xóa rác val_24
                  if 'val_24' in line and parts[0] in ['MemoryData', 'Split']:
                      continue
                  
                  # 2. Sửa Slice động (-23300=4,-233...)
                  if len(parts) > 5 and parts[0] == 'Slice' and '-23300=4,-233,-233,-233,-233' in parts:
                      node_name = parts[1]
                      num_inputs = int(parts[2])
                      num_outputs = int(parts[3])
                      data_blob = parts[4] # group_norm
                      output_blobs = parts[4+num_inputs : 4+num_inputs+num_outputs]
                      
                      for i, out_blob in enumerate(output_blobs):
                          start, end = splits[i]
                          static_slice_line = f"Slice            {node_name}_{i} 1 1 {data_blob} {out_blob} -23300=1,{start} -23301=1,{end} -23302=1,0\n"
                          new_lines.append(static_slice_line)
                          added_slices += 1
                      removed_dynamic += 1

                  # 3. Sửa Crop động (-23309=1,0 -23310=1,15...)
                  elif len(parts) > 5 and parts[0] == 'Crop' and '-23309=1,0' in parts and '-23310=1,15' in parts:
                      node_name = parts[1]
                      num_inputs = int(parts[2])
                      num_outputs = int(parts[3])
                      # Ở Crop, input[0] thường là group_norm_splitncnn_X
                      # Ta phải truy ngược lại, nhưng vì đã xóa Split ở bước 1, 
                      # ta thay thẳng bằng group_norm. Cách an toàn là lấy đuôi blob.
                      input_blob = parts[4] 
                      output_blobs = parts[4+num_inputs : 4+num_inputs+num_outputs]
                      
                      # Trong file của bạn, Crop input là group_norm_splitncnn_X
                      # Ta cần đổi nó thành group_norm
                      if "group_norm" in input_blob:
                          data_blob = "group_norm" # Fallback về group_norm
                      else:
                          data_blob = input_blob

                      for i, out_blob in enumerate(output_blobs):
                          start, end = splits[i]
                          static_slice_line = f"Slice            {node_name}_{i} 1 1 {data_blob} {out_blob} -23300=1,{start} -23301=1,{end} -23302=1,0\n"
                          new_lines.append(static_slice_line)
                          added_slices += 1
                      removed_dynamic += 1
                      
                  else:
                      new_lines.append(line)
              
              # 4. Cập nhật Header (Layer count)
              magic = new_lines[0].strip()
              blob_count = new_lines[1].strip().split()[1]
              actual_layers = len(new_lines) - 2
              new_lines[1] = f"{actual_layers} {blob_count}\n"
              
              with open(output_file, 'w') as f:
                  f.writelines(new_lines)
                  
              print(f"✅ Ultimate Fix Applied! Removed {removed_dynamic} dynamic nodes, added {added_slices} static Slice nodes.")
              print(f"Final Layer Count: {actual_layers}")

          ultimate_fix('raw.param', '2xParagonSR_Nano_gan.param')
          PYEOF
