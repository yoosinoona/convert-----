name: Convert 2xParagonSR_Nano_gan (Final Auto-Fix)

on:
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python deps
        run: pip install onnx onnxsim numpy

      - name: Download ONNX model
        run: |
          wget -q "https://github.com/Phhofm/models/releases/download/2xParagonSR_Nano_gan/2xParagonSR_Nano_gan_op18_fp32.onnx"
          wget -q "https://github.com/Phhofm/models/releases/download/2xParagonSR_Nano_gan/2xParagonSR_Nano_gan_op18_fp32.onnx.data"
          # Tạo bản copy cho đúng tên ONNX gốc cần tìm
          cp 2xParagonSR_Nano_gan_op18_fp32.onnx.data net_g_75000_fused_op18_fp32.onnx.data

      - name: Merge external data
        run: |
          python3 << 'PYEOF'
          import onnx
          import os
          print("Loading ONNX with external data...")
          model = onnx.load("2xParagonSR_Nano_gan_op18_fp32.onnx", load_external_data=True)
          onnx.save(model, "merged.onnx", save_as_external_data=False)
          print(f"Merged OK! Size: {os.path.getsize('merged.onnx') / (1024*1024):.1f} MB")
          PYEOF

      - name: Simplify ONNX
        run: |
          python -m onnxsim merged.onnx model_final.onnx --input-shape "input:1,3,256,256"
          ls -lh model_final.onnx

      - name: Download ncnn tools & install deps
        run: |
          wget -q "https://github.com/Tencent/ncnn/releases/download/20240820/ncnn-20240820-ubuntu-2204.zip"
          unzip -q ncnn-20240820-ubuntu-2204.zip
          chmod +x ncnn-20240820-ubuntu-2204/bin/*
          wget -q "http://archive.ubuntu.com/ubuntu/pool/main/p/protobuf/libprotobuf23_3.12.4-1ubuntu7_amd64.deb"
          sudo dpkg -i libprotobuf23_3.12.4-1ubuntu7_amd64.deb || true

      - name: Convert ONNX to NCNN
        run: |
          ONNX2NCNN=./ncnn-20240820-ubuntu-2204/bin/onnx2ncnn
          $ONNX2NCNN model_final.onnx raw.param raw.bin 2>&1
          if [ ! -f "raw.param" ] || [ ! -f "raw.bin" ]; then echo "ERROR: onnx2ncnn failed!"; exit 1; fi
          echo "=== onnx2ncnn OK ==="

      - name: Auto-Fix NCNN Param (Split+Crop -> Slice)
        run: |
          python3 << 'PYEOF'
          import re

          def fix_ncnn_param(input_file, output_file):
              with open(input_file, 'r') as f:
                  lines = f.readlines()

              magic = lines[0].strip()
              counts = lines[1].strip().split()
              layer_count = int(counts[0])
              blob_count = counts[1]

              # Tìm các node Split và Crop lỗi
              split_map = {}   # output_blob -> input_blob
              split_indices = set()
              crop_info_map = {} # line_index -> info_dict

              for i in range(2, len(lines)):
                  line = lines[i]
                  parts = line.strip().split()
                  if len(parts) < 5: continue
                  
                  op_type = parts[0]
                  
                  if op_type == 'Split':
                      num_inputs = int(parts[2])
                      num_outputs = int(parts[3])
                      input_blobs = parts[4:4+num_inputs]
                      output_blobs = parts[4+num_inputs:4+num_inputs+num_outputs]
                      input_blob = input_blobs[0] if input_blobs else None
                      if input_blob:
                          for ob in output_blobs:
                              split_map[ob] = input_blob
                      split_indices.add(i)
                      
                  elif op_type == 'Crop':
                      match = re.search(r'-23309=1,(\d+)\s+-23310=1,(\d+)\s+-23311=1,0', line)
                      if match:
                          num_inputs = int(parts[2])
                          num_outputs = int(parts[3])
                          input_blobs = parts[4:4+num_inputs]
                          output_blobs = parts[4+num_inputs:4+num_inputs+num_outputs]
                          node_name = parts[1]
                          input_blob = input_blobs[0] if input_blobs else None
                          output_blob = output_blobs[0] if output_blobs else None
                          if input_blob and output_blob:
                              crop_info_map[i] = {
                                  'name': node_name, 'input': input_blob, 'output': output_blob,
                                  'start': match.group(1), 'end': match.group(2)
                              }

              # Tìm các node Split mà tất cả output đều đi vào Crop lỗi
              lines_to_remove = set()
              removed_splits = 0
              for idx in split_indices:
                  parts = lines[idx].strip().split()
                  num_inputs = int(parts[2])
                  num_outputs = int(parts[3])
                  output_blobs = parts[4+num_inputs:4+num_inputs+num_outputs]
                  can_remove = True
                  for ob in output_blobs:
                      is_used_by_our_crop = any(c['input'] == ob for c in crop_info_map.values())
                      if not is_used_by_our_crop: can_remove = False; break
                  if can_remove:
                      lines_to_remove.add(idx)
                      removed_splits += 1

              # Ghi file mới
              new_layer_count = layer_count - removed_splits
              new_lines = [f"{magic}\n", f"{new_layer_count} {blob_count}\n"]
              replaced_crops = 0
              
              for i in range(2, len(lines)):
                  if i in lines_to_remove: continue # Xóa node Split
                  if i in crop_info_map:
                      crop_info = crop_info_map[i]
                      original_input = split_map.get(crop_info['input'], crop_info['input'])
                      # Chuyển Crop thành Slice tĩnh nối thẳng về tensor GroupNorm
                      new_line = f"Slice            {crop_info['name']} 1 1 {original_input} {crop_info['output']} -23300=1,{crop_info['start']} -23301=1,{crop_info['end']} -23302=1,0\n"
                      new_lines.append(new_line)
                      replaced_crops += 1
                  else:
                      new_lines.append(lines[i])

              with open(output_file, 'w') as f:
                  f.writelines(new_lines)
              print(f"✅ Auto-Fixed Param: Removed {removed_splits} Split nodes, replaced {replaced_crops} Crop nodes with Slice nodes.")

          fix_ncnn_param('raw.param', '2xParagonSR_Nano_gan.param')
          PYEOF

      - name: Post-process & final check
        run: |
          cp raw.bin 2xParagonSR_Nano_gan.bin

          if grep -q "DepthToSpace" 2xParagonSR_Nano_gan.param; then
            sed -i 's/DepthToSpace/PixelShuffle/g' 2xParagonSR_Nano_gan.param
          fi

          echo "=== Final Param Validation ==="
          head -3 2xParagonSR_Nano_gan.param
          
          if grep -q "Crop.*\-23309" 2xParagonSR_Nano_gan.param; then
            echo "⚠️ WARNING: File still contains dynamic Crop!"
          else
            echo "✅ Model is completely clean from dynamic Crop/Split!"
          fi

          echo "Slice layers: $(grep -c 'Slice' 2xParagonSR_Nano_gan.param || echo 0)"
          echo "Crop layers: $(grep -c 'Crop' 2xParagonSR_Nano_gan.param || echo 0)"

          echo "=== CONVERSION SUCCESS ==="
          ls -lh 2xParagonSR_Nano_gan.param 2xParagonSR_Nano_gan.bin

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 2xParagonSR_Nano_gan_ncnn_definitive
          path: |
            2xParagonSR_Nano_gan.param
            2xParagonSR_Nano_gan.bin
          retention-days: 90
