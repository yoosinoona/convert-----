name: Convert 2xParagonSR_Nano_gan (PNNX)

on:
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python deps
        run: pip install onnx onnxsim numpy

      - name: Download ONNX model
        run: |
          wget -q "https://github.com/Phhofm/models/releases/download/2xParagonSR_Nano_gan/2xParagonSR_Nano_gan_op18_fp32.onnx"
          wget -q "https://github.com/Phhofm/models/releases/download/2xParagonSR_Nano_gan/2xParagonSR_Nano_gan_op18_fp32.onnx.data"
          cp 2xParagonSR_Nano_gan_op18_fp32.onnx.data net_g_75000_fused_op18_fp32.onnx.data

      - name: Merge external data
        run: |
          python3 << 'PYEOF'
          import onnx
          import os
          print("Loading ONNX with external data...")
          model = onnx.load("2xParagonSR_Nano_gan_op18_fp32.onnx", load_external_data=True)
          onnx.save(model, "merged.onnx", save_as_external_data=False)
          print(f"Merged OK! Size: {os.path.getsize('merged.onnx') / (1024*1024):.1f} MB")
          PYEOF

      - name: Simplify ONNX
        run: |
          python -m onnxsim merged.onnx model_final.onnx --input-shape "input:1,3,256,256" 2>&1 || cp merged.onnx model_final.onnx
          ls -lh model_final.onnx

      - name: Install PNNX
        run: pip install pnnx

      - name: Convert ONNX to NCNN using PNNX
        run: |
          # Chạy PNNX với file ONNX đã simplify
          pnnx model_final.onnx
          
          # PNNX sẽ tạo ra một thư mục có tên dạng model_final_pnnx
          # Bên trong chứa file .param và .bin
          echo "=== Checking PNNX output ==="
          ls -lR model_final_pnnx/
          
          # Copy file ra ngoài và đổi tên cho chuẩn
          cp model_final_pnnx/model_final.ncnn.param 2xParagonSR_Nano_gan.param
          cp model_final_pnnx/model_final.ncnn.bin    2xParagonSR_Nano_gan.bin

      - name: Final validation
        run: |
          # DepthToSpace → PixelShuffle (PNNX thường tự xử lý, nhưng cứ sed cho chắc)
          if grep -q "DepthToSpace" 2xParagonSR_Nano_gan.param; then
            sed -i 's/DepthToSpace/PixelShuffle/g' 2xParagonSR_Nano_gan.param
          fi

          echo "=== Final Param Validation ==="
          head -3 2xParagonSR_Nano_gan.param
          
          if grep -q "\-23300=4,\-233" 2xParagonSR_Nano_gan.param || grep -q "Crop.*\-23309" 2xParagonSR_Nano_gan.param; then
            echo "⚠️ WARNING: File still contains dynamic patterns!"
          else
            echo "✅ Model is completely clean from dynamic Slice/Crop!"
          fi

          echo "=== CONVERSION SUCCESS ==="
          ls -lh 2xParagonSR_Nano_gan.param 2xParagonSR_Nano_gan.bin

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 2xParagonSR_Nano_gan_ncnn_pnnx
          path: |
            2xParagonSR_Nano_gan.param
            2xParagonSR_Nano_gan.bin
          retention-days: 90
