name: Convert 1x-SkinContrast-SuperUltraCompact to ONNX

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install spandrel onnx onnxruntime numpy

      - name: Create conversion script
        run: |
          cat > convert.py << 'PYEOF'
          import os
          import torch
          import torch.nn as nn
          import onnx
          import onnxruntime as ort
          import numpy as np
          from spandrel import ModelLoader

          MODEL_PATH = "model.pth"
          ONNX_PATH = "output/1x-SkinContrast-SuperUltraCompact.onnx"

          def main():
              os.makedirs("output", exist_ok=True)

              print("=" * 60)
              print("Loading model with spandrel...")
              print("=" * 60)

              loader = ModelLoader()
              model_descriptor = loader.load_from_file(MODEL_PATH)
              model = model_descriptor.model
              model.eval()
              model.cpu()

              print(f"  Architecture     : {model_descriptor.architecture}")
              print(f"  Scale            : {model_descriptor.scale}")
              print(f"  Input channels   : {model_descriptor.input_channels}")
              print(f"  Output channels  : {model_descriptor.output_channels}")

              dummy_input = torch.randn(1, 3, 64, 64, dtype=torch.float32)

              print("\n" + "=" * 60)
              print("Exporting to ONNX...")
              print("=" * 60)

              torch.onnx.export(
                  model,
                  dummy_input,
                  ONNX_PATH,
                  export_params=True,
                  opset_version=17,
                  do_constant_folding=True,
                  input_names=["input"],
                  output_names=["output"],
                  dynamic_axes={
                      "input":  {0: "batch", 2: "height", 3: "width"},
                      "output": {0: "batch", 2: "height", 3: "width"},
                  },
              )
              print(f"  Exported to: {ONNX_PATH}")

              print("\n" + "=" * 60)
              print("Validating ONNX model...")
              print("=" * 60)

              onnx_model = onnx.load(ONNX_PATH)
              onnx.checker.check_model(onnx_model)
              print("  ONNX checker: PASSED")

              session = ort.InferenceSession(ONNX_PATH, providers=["CPUExecutionProvider"])
              test_input = np.random.randn(1, 3, 128, 128).astype(np.float32)
              result = session.run(None, {"input": test_input})
              print(f"  Inference test: input {test_input.shape} -> output {result[0].shape}")

              size_mb = os.path.getsize(ONNX_PATH) / (1024 * 1024)
              print(f"  File size: {size_mb:.2f} MB")

              print("\n" + "=" * 60)
              print("DONE - Model converted successfully!")
              print("=" * 60)

          if __name__ == "__main__":
              main()
          PYEOF

      - name: Download model from OpenModelDB
        run: |
          wget --no-verbose --tries=3 --timeout=60 \
            -O model.pth \
            "https://www.mediafire.com/file/hnvatglitgayunh/1xSkinContrast-SuperUltraCompact.pth"

          echo "File size: $(du -h model.pth | cut -f1)"
          echo "SHA256: $(sha256sum model.pth | cut -d' ' -f1)"

      - name: Convert to ONNX
        run: python convert.py

      - name: Create release package
        run: |
          cd output
          zip -9 1x-SkinContrast-SuperUltraCompact-ONNX.zip *.onnx
          sha256sum *.onnx > checksums.txt
          ls -lh

      - name: Upload ONNX artifact
        uses: actions/upload-artifact@v4
        with:
          name: 1x-SkinContrast-SuperUltraCompact-ONNX
          path: |
            output/*.onnx
            output/checksums.txt
          retention-days: 30

      - name: Upload to Release (if tag exists)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            output/1x-SkinContrast-SuperUltraCompact-ONNX.zip
            output/checksums.txt
